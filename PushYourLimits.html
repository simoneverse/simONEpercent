<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Push Your Limits</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeede9;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--info-bg:#dbeafe;--info-text:#1e40af;--green:#16a34a;--green-bg:#dcfce7;--radius:10px;--radius-lg:14px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#272725;--bg3:#323230;--text:#f0efeb;--text2:#a0a09b;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--info-bg:#1e3a5f;--info-text:#93c5fd;--green:#4ade80;--green-bg:#14532d}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
#app{width:100%;max-width:560px}
.screen{display:none}.screen.active{display:block}
.selector-header{margin-bottom:1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.selector-header h1{font-size:22px;font-weight:500;color:var(--text)}
.selector-header p{font-size:13px;color:var(--text2);margin-top:4px}
.reset-btn{font-size:12px;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.reset-btn:hover{background:var(--bg2);color:var(--text)}
.week-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.5rem}
.week-tab{font-size:13px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all 0.15s;font-family:inherit;position:relative}
.week-tab:hover{background:var(--bg2)}.week-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.week-tab .week-dot{width:6px;height:6px;border-radius:50%;background:var(--green);position:absolute;top:4px;right:4px}
.workout-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.workout-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;cursor:pointer;transition:all 0.15s;position:relative}
.workout-card:hover{border-color:var(--border2);background:var(--bg2)}
.workout-card.completed{border-color:var(--green)}
.workout-card h3{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px}
.workout-card .meta{font-size:12px;color:var(--text2);line-height:1.6}
.workout-card .badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--info-bg);color:var(--info-text)}
.workout-card .done-badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--green-bg);color:var(--green);margin-left:4px}
.workout-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.back-btn{font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;font-family:inherit}
.back-btn:hover{color:var(--text)}
.workout-label{font-size:13px;color:var(--text2);text-align:right}
.round-indicator{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.round-pip{width:28px;height:6px;border-radius:3px;background:var(--border);transition:background 0.3s}
.round-pip.done{background:var(--text)}.round-pip.current{background:var(--text2)}
.progress-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:1rem;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--text);border-radius:2px;transition:width 0.3s}
.exercise-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:2rem 1.5rem;text-align:center;margin-bottom:1rem;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.exercise-number{font-size:64px;font-weight:500;line-height:1;color:var(--text);margin-bottom:8px}
.exercise-name{font-size:22px;font-weight:500;color:var(--text);margin-bottom:6px}
.exercise-sub{font-size:13px;color:var(--text2)}
.countdown-ring{position:relative;width:120px;height:120px;margin-bottom:12px}
.countdown-ring svg{transform:rotate(-90deg)}
.countdown-ring .time-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:500;color:var(--text)}
.exercise-nav{display:flex;gap:8px;align-items:center;margin-bottom:1rem}
.nav-btn{flex:1;padding:12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);font-size:14px;cursor:pointer;color:var(--text);transition:all 0.15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn:hover{background:var(--bg2)}.nav-btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.nav-btn.primary:hover{opacity:0.85}.nav-btn:disabled{opacity:0.3;cursor:default}
.up-next{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);font-size:13px;color:var(--text2)}
.up-next strong{color:var(--text);font-weight:500}
.rest-screen{text-align:center;padding:2rem 0}
.rest-screen h2{font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px}
.rest-screen p{font-size:13px;color:var(--text2);margin-bottom:2rem}
.rest-timer{font-size:72px;font-weight:500;color:var(--text);line-height:1;margin-bottom:2rem;font-variant-numeric:tabular-nums}
.done-screen{text-align:center;padding:3rem 0}
.done-screen .big-icon{font-size:48px;margin-bottom:1rem}
.done-screen h2{font-size:22px;font-weight:500;color:var(--text);margin-bottom:8px}
.done-screen p{font-size:14px;color:var(--text2);margin-bottom:2rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:2rem}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px}
.stat-card .val{font-size:22px;font-weight:500;color:var(--text)}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.center-btn{max-width:200px;margin:0 auto;display:flex}
.progress-summary{font-size:12px;color:var(--text2);margin-bottom:1.5rem}
.progress-summary span{color:var(--green);font-weight:500}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.confirm-overlay.active{display:flex}
.confirm-box{background:var(--bg);border-radius:var(--radius-lg);padding:1.5rem;max-width:300px;width:90%;text-align:center}
.confirm-box h3{font-size:16px;font-weight:500;margin-bottom:8px;color:var(--text)}
.confirm-box p{font-size:13px;color:var(--text2);margin-bottom:1.5rem}
.confirm-btns{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app">
  <div id="screen-select" class="screen active">
    <div class="selector-header">
      <div><h1>Push your limits</h1><p>12-week training plan</p></div>
      <button class="reset-btn" onclick="confirmReset()">&#x21BA; reset all</button>
    </div>
    <div class="progress-summary" id="progress-summary"></div>
    <div class="week-tabs" id="week-tabs"></div>
    <div class="workout-cards" id="workout-cards"></div>
  </div>
  <div id="screen-workout" class="screen">
    <div class="workout-top">
      <button class="back-btn" onclick="goBack()">&#8592; back</button>
      <div class="workout-label" id="workout-label"></div>
    </div>
    <div class="round-indicator" id="round-indicator"></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <div class="exercise-card" id="exercise-card"></div>
    <div class="exercise-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevExercise()">&#8592; prev</button>
      <button class="nav-btn primary" id="next-btn" onclick="nextExercise()">done &#8594;</button>
    </div>
    <div class="up-next" id="up-next-bar"></div>
  </div>
  <div id="screen-rest" class="screen">
    <div class="workout-top">
      <button class="back-btn" onclick="skipRest()">skip rest &#8594;</button>
      <div class="workout-label" id="rest-label"></div>
    </div>
    <div class="rest-screen">
      <h2>rest</h2><p id="rest-sub"></p>
      <div class="rest-timer" id="rest-timer">30</div>
      <button class="nav-btn primary center-btn" onclick="skipRest()">start round <span id="rest-round-num"></span> &#8594;</button>
    </div>
  </div>
  <div id="screen-done" class="screen">
    <div class="done-screen">
      <div class="big-icon">&#127942;</div>
      <h2>workout complete!</h2>
      <p id="done-sub"></p>
      <div class="stats-grid">
        <div class="stat-card"><div class="val" id="done-rounds"></div><div class="lbl">rounds</div></div>
        <div class="stat-card"><div class="val" id="done-exercises"></div><div class="lbl">exercises</div></div>
        <div class="stat-card"><div class="val" id="done-time"></div><div class="lbl">minutes</div></div>
      </div>
      <button class="nav-btn primary center-btn" onclick="goHome()">back to workouts</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3>Reset all progress?</h3>
    <p>This will clear all your completed workouts. This cannot be undone.</p>
    <div class="confirm-btns">
      <button class="nav-btn" onclick="cancelReset()">cancel</button>
      <button class="nav-btn primary" onclick="doReset()">reset</button>
    </div>
  </div>
</div>

ps"},{qty:"40/20",name:"180 jump squats"},{qty:"40/20",name:"Leg raises"},{qty:"40/20",name:"Bicycle crunches"}]}],"Week 12":[{name:"Workout 1",rounds:5,exercises:[{qty:"25",name:"Star jacks"},{qty:"20",name:"Push-ups"},{qty:"25",name:"Single-leg deadlift L"},{qty:"25",name:"Single-leg deadlift R"},{qty:"20",name:"Up downs"},{qty:"50",name:"Punches"},{qty:"20",name:"Skier abs"}]},{name:"Workout 2",rounds:6,exercises:[{qty:"40",name:"Burpees"},{qty:"40",name:"Jump squats"},{qty:"40",name:"Punches"},{qty:"10",name:"High plank limb raises"}]},{name:"Workout 3",rounds:6,exercises:[{qty:"40",name:"High knees"},{qty:"40",name:"Rockstars"},{qty:"20",name:"Burpees"}]},{name:"Workout 4",rounds:5,exercises:[{qty:"30",name:"Push-ups"},{qty:"30",name:"Jump lunges"},{qty:"30",name:"High plank knee crosses"},{qty:"30",name:"Tricep dips"},{qty:"30",name:"Jump squats"},{qty:"30",name:"Russian twists"}]}]};

var selectedWeek = "Week 1";
var currentWorkout = null;
var currentRound = 0;
var currentExerciseIdx = 0;
var timerInterval = null;
var timerSeconds = 0;
var startTime = null;
var restInterval = null;
var restSeconds = 0;
var countdownInterval = null;

function getCompleted() {
  try { return JSON.parse(localStorage.getItem('pyl_completed') || '{}'); } catch(e) { return {}; }
}
function setCompleted(data) {
  try { localStorage.setItem('pyl_completed', JSON.stringify(data)); } catch(e) {}
}
function markDone(week, idx) {
  var c = getCompleted();
  if (!c[week]) c[week] = {};
  c[week][idx] = true;
  setCompleted(c);
}
function isDone(week, idx) {
  var c = getCompleted();
  return !!(c[week] && c[week][idx]);
}
function totalDone() {
  var c = getCompleted(), n = 0;
  Object.keys(c).forEach(function(w) { n += Object.keys(c[w]).length; });
  return n;
}
function totalWorkouts() {
  var n = 0;
  Object.keys(WORKOUTS).forEach(function(w) { n += WORKOUTS[w].length; });
  return n;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
}

function renderWeekTabs() {
  var tabs = document.getElementById('week-tabs');
  tabs.innerHTML = '';
  Object.keys(WORKOUTS).forEach(function(w) {
    var btn = document.createElement('button');
    btn.className = 'week-tab' + (w === selectedWeek ? ' active' : '');
    btn.textContent = w.replace('Week ', 'W');
    var wos = WORKOUTS[w];
    var allDone = wos.every(function(wo, i) { return isDone(w, i); });
    if (allDone) {
      var dot = document.createElement('span');
      dot.className = 'week-dot';
      btn.appendChild(dot);
    }
    btn.onclick = function() { selectedWeek = w; renderWeekTabs(); renderWorkoutCards(); };
    tabs.appendChild(btn);
  });
}

function renderWorkoutCards() {
  var cards = document.getElementById('workout-cards');
  cards.innerHTML = '';
  var wos = WORKOUTS[selectedWeek] || [];
  wos.forEach(function(wo, i) {
    var card = document.createElement('div');
    var done = isDone(selectedWeek, i);
    card.className = 'workout-card' + (done ? ' completed' : '');
    var badge = done
      ? '<span class="done-badge">&#10003; done</span>'
      : '<span class="badge">' + selectedWeek + '</span>';
    card.innerHTML = '<h3>' + wo.name + '</h3><div class="meta">' + wo.exercises.length + ' exercises<br>' + wo.rounds + ' round' + (wo.rounds !== 1 ? 's' : '') + '</div>' + badge;
    card.onclick = function() { startWorkout(selectedWeek, i); };
    cards.appendChild(card);
  });
  var done = totalDone();
  var total = totalWorkouts();
  var summary = document.getElementById('progress-summary');
  summary.innerHTML = '<span>' + done + '</span> of ' + total + ' workouts completed';
}

function startWorkout(week, idx) {
  currentWorkout = { week: week, idx: idx, data: WORKOUTS[week][idx] };
  currentRound = 0;
  currentExerciseIdx = 0;
  startTime = Date.now();
  timerSeconds = 0;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() { timerSeconds++; }, 1000);
  renderWorkoutScreen();
  showScreen('workout');
}

function renderWorkoutScreen() {
  var wo = currentWorkout.data;
  var ex = wo.exercises[currentExerciseIdx];
  var total = wo.exercises.length;
  document.getElementById('workout-label').textContent = currentWorkout.week + ' \u00b7 ' + wo.name;
  var pips = document.getElementById('round-indicator');
  pips.innerHTML = '';
  for (var r = 0; r < wo.rounds; r++) {
    var pip = document.createElement('div');
    pip.className = 'round-pip' + (r < currentRound ? ' done' : r === currentRound ? ' current' : '');
    pips.appendChild(pip);
  }
  document.getElementById('progress-bar').style.width = Math.round(((currentRound * total + currentExerciseIdx) / (total * wo.rounds)) * 100) + '%';
  var card = document.getElementById('exercise-card');
  card.innerHTML = '';
  var isTimed = /sec/i.test(ex.qty);
  if (isTimed) {
    var secs = parseInt(ex.qty);
    var ring = document.createElement('div');
    ring.className = 'countdown-ring';
    var c = 2 * Math.PI * 52;
    ring.innerHTML = '<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="6"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--text)" stroke-width="6" stroke-dasharray="' + c + '" stroke-dashoffset="0" id="ring-progress" style="transition:stroke-dashoffset 1s linear"/></svg><div class="time-text" id="ring-time">' + secs + '</div>';
    card.appendChild(ring);
    startCountdown(secs);
  } else {
    var q = document.createElement('div');
    q.className = 'exercise-number';
    q.textContent = ex.qty;
    card.appendChild(q);
  }
  var n = document.createElement('div');
  n.className = 'exercise-name';
  n.textContent = ex.name;
  card.appendChild(n);
  var s = document.createElement('div');
  s.className = 'exercise-sub';
  s.textContent = 'round ' + (currentRound + 1) + ' of ' + wo.rounds;
  card.appendChild(s);
  document.getElementById('prev-btn').disabled = (currentRound === 0 && currentExerciseIdx === 0);
  var isLast = (currentRound === wo.rounds - 1 && currentExerciseIdx === total - 1);
  document.getElementById('next-btn').textContent = isLast ? 'finish \u2713' : 'done \u2192';
  var upNext = document.getElementById('up-next-bar');
  if (isLast) {
    upNext.textContent = '\u2605 last exercise \u2014 finish strong!';
  } else {
    var ni = currentExerciseIdx + 1 < total ? currentExerciseIdx + 1 : 0;
    var nr = currentExerciseIdx + 1 >= total ? currentRound + 1 : currentRound;
    var ne = wo.exercises[ni];
    var inr = currentExerciseIdx + 1 >= total;
    upNext.innerHTML = 'up next: <strong>' + ne.qty + ' ' + ne.name + '</strong>' + (inr ? ' \u00b7 round ' + (nr + 1) : '');
  }
}

function startCountdown(secs) {
  if (countdownInterval) clearInterval(countdownInterval);
  var rem = secs;
  var c = 2 * Math.PI * 52;
  var upd = function() {
    var t = document.getElementById('ring-time');
    var r = document.getElementById('ring-progress');
    if (!t || !r) { clearInterval(countdownInterval); return; }
    t.textContent = rem;
    r.setAttribute('stroke-dashoffset', c * (1 - rem / secs));
    if (rem <= 0) clearInterval(countdownInterval);
    rem--;
  };
  upd();
  countdownInterval = setInterval(upd, 1000);
}

function nextExercise() {
  if (countdownInterval) clearInterval(countdownInterval);
  var wo = currentWorkout.data;
  var total = wo.exercises.length;
  var isLast = (currentRound === wo.rounds - 1 && currentExerciseIdx === total - 1);
  if (isLast) { finishWorkout(); return; }
  currentExerciseIdx++;
  if (currentExerciseIdx >= total) {
    currentExerciseIdx = 0;
    if (currentRound < wo.rounds - 1) { showRestScreen(currentRound + 1); return; }
    currentRound++;
  }
  renderWorkoutScreen();
}

function prevExercise() {
  if (countdownInterval) clearInterval(countdownInterval);
  var wo = currentWorkout.data;
  if (currentExerciseIdx > 0) currentExerciseIdx--;
  else if (currentRound > 0) { currentRound--; currentExerciseIdx = wo.exercises.length - 1; }
  renderWorkoutScreen();
}

function showRestScreen(nextRound) {
  currentRound = nextRound;
  restSeconds = 30;
  document.getElementById('rest-timer').textContent = restSeconds;
  document.getElementById('rest-label').textContent = currentWorkout.week + ' \u00b7 ' + currentWorkout.data.name;
  document.getElementById('rest-round-num').textContent = nextRound + 1;
  document.getElementById('rest-sub').textContent = 'round ' + nextRound + ' done \u2014 round ' + (nextRound + 1) + ' coming up';
  showScreen('rest');
  if (restInterval) clearInterval(restInterval);
  restInterval = setInterval(function() {
    restSeconds--;
    document.getElementById('rest-timer').textContent = restSeconds;
    if (restSeconds <= 0) { clearInterval(restInterval); skipRest(); }
  }, 1000);
}

function skipRest() {
  if (restInterval) clearInterval(restInterval);
  renderWorkoutScreen();
  showScreen('workout');
}

function finishWorkout() {
  if (timerInterval) clearInterval(timerInterval);
  if (countdownInterval) clearInterval(countdownInterval);
  markDone(currentWorkout.week, currentWorkout.idx);
  var wo = currentWorkout.data;
  var elapsed = Math.round((Date.now() - startTime) / 60000);
  document.getElementById('done-sub').textContent = currentWorkout.week + ' \u00b7 ' + wo.name;
  document.getElementById('done-rounds').textContent = wo.rounds;
  document.getElementById('done-exercises').textContent = wo.exercises.length * wo.rounds;
  document.getElementById('done-time').textContent = elapsed || '<1';
  showScreen('done');
}

function goBack() {
  if (countdownInterval) clearInterval(countdownInterval);
  if (timerInterval) clearInterval(timerInterval);
  timerSeconds = 0;
  showScreen('select');
}

function goHome() {
  timerSeconds = 0;
  renderWeekTabs();
  renderWorkoutCards();
  showScreen('select');
}

function confirmReset() {
  document.getElementById('confirm-overlay').classList.add('active');
}

function cancelReset() {
  document.getElementById('confirm-overlay').classList.remove('active');
}

function doReset() {
  try { localStorage.removeItem('pyl_completed'); } catch(e) {}
  document.getElementById('confirm-overlay').classList.remove('active');
  renderWeekTabs();
  renderWorkoutCards();
}

renderWeekTabs();
renderWorkoutCards();
</script>
</body>
</html>
