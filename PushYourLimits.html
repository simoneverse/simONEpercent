<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Push Your Limits — 12-Week Training</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeede9;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--info-bg:#dbeafe;--info-text:#1e40af;--radius:10px;--radius-lg:14px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#272725;--bg3:#323230;--text:#f0efeb;--text2:#a0a09b;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);--info-bg:#1e3a5f;--info-text:#93c5fd}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
#app{width:100%;max-width:560px}
.screen{display:none}.screen.active{display:block}
.selector-header{margin-bottom:1.5rem}
.selector-header h1{font-size:22px;font-weight:500;color:var(--text)}
.selector-header p{font-size:13px;color:var(--text2);margin-top:4px}
.week-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.5rem}
.week-tab{font-size:13px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all 0.15s;font-family:inherit}
.week-tab:hover{background:var(--bg2)}.week-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.workout-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.workout-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;cursor:pointer;transition:all 0.15s}
.workout-card:hover{border-color:var(--border2);background:var(--bg2)}
.workout-card h3{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px}
.workout-card .meta{font-size:12px;color:var(--text2);line-height:1.6}
.workout-card .badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--info-bg);color:var(--info-text)}
.workout-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.back-btn{font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;font-family:inherit}
.back-btn:hover{color:var(--text)}
.workout-label{font-size:13px;color:var(--text2);text-align:right}
.round-indicator{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.round-pip{width:28px;height:6px;border-radius:3px;background:var(--border);transition:background 0.3s}
.round-pip.done{background:var(--text)}.round-pip.current{background:var(--text2)}
.progress-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:1rem;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--text);border-radius:2px;transition:width 0.3s}
.exercise-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:2rem 1.5rem;text-align:center;margin-bottom:1rem;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.exercise-number{font-size:64px;font-weight:500;line-height:1;color:var(--text);margin-bottom:8px}
.exercise-name{font-size:22px;font-weight:500;color:var(--text);margin-bottom:6px}
.exercise-sub{font-size:13px;color:var(--text2)}
.countdown-ring{position:relative;width:120px;height:120px;margin-bottom:12px}
.countdown-ring svg{transform:rotate(-90deg)}
.countdown-ring .time-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:500;color:var(--text)}
.exercise-nav{display:flex;gap:8px;align-items:center;margin-bottom:1rem}
.nav-btn{flex:1;padding:12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);font-size:14px;cursor:pointer;color:var(--text);transition:all 0.15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn:hover{background:var(--bg2)}.nav-btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.nav-btn.primary:hover{opacity:0.85}.nav-btn:disabled{opacity:0.3;cursor:default}
.up-next{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);font-size:13px;color:var(--text2)}
.up-next strong{color:var(--text);font-weight:500}
.rest-screen{text-align:center;padding:2rem 0}
.rest-screen h2{font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px}
.rest-screen p{font-size:13px;color:var(--text2);margin-bottom:2rem}
.rest-timer{font-size:72px;font-weight:500;color:var(--text);line-height:1;margin-bottom:2rem;font-variant-numeric:tabular-nums}
.done-screen{text-align:center;padding:3rem 0}
.done-screen .big-icon{font-size:48px;margin-bottom:1rem}
.done-screen h2{font-size:22px;font-weight:500;color:var(--text);margin-bottom:8px}
.done-screen p{font-size:14px;color:var(--text2);margin-bottom:2rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:2rem}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px}
.stat-card .val{font-size:22px;font-weight:500;color:var(--text)}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.center-btn{max-width:200px;margin:0 auto;display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="screen-select" class="screen active">
    <div class="selector-header"><h1>Push your limits</h1><p>12-week training plan — pick a week and workout to begin</p></div>
    <div class="week-tabs" id="week-tabs"></div>
    <div class="workout-cards" id="workout-cards"></div>
  </div>
  <div id="screen-workout" class="screen">
    <div class="workout-top">
      <button class="back-btn" onclick="goBack()">&#8592; back</button>
      <div class="workout-label" id="workout-label"></div>
    </div>
    <div class="round-indicator" id="round-indicator"></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <div class="exercise-card" id="exercise-card"></div>
    <div class="exercise-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevExercise()">&#8592; prev</button>
      <button class="nav-btn primary" id="next-btn" onclick="nextExercise()">done &#8594;</button>
    </div>
    <div class="up-next" id="up-next-bar"></div>
  </div>
  <div id="screen-rest" class="screen">
    <div class="workout-top">
      <button class="back-btn" onclick="skipRest()">skip rest &#8594;</button>
      <div class="workout-label" id="rest-label"></div>
    </div>
    <div class="rest-screen">
      <h2>rest</h2><p id="rest-sub"></p>
      <div class="rest-timer" id="rest-timer">30</div>
      <button class="nav-btn primary center-btn" onclick="skipRest()">start round <span id="rest-round-num"></span> &#8594;</button>
    </div>
  </div>
  <div id="screen-done" class="screen">
    <div class="done-screen">
      <div class="big-icon">&#127942;</div>
      <h2>workout complete!</h2>
      <p id="done-sub"></p>
      <div class="stats-grid">
        <div class="stat-card"><div class="val" id="done-rounds"></div><div class="lbl">rounds</div></div>
        <div class="stat-card"><div class="val" id="done-exercises"></div><div class="lbl">exercises</div></div>
        <div class="stat-card"><div class="val" id="done-time"></div><div class="lbl">minutes</div></div>
      </div>
      <button class="nav-btn primary center-btn" onclick="goHome()">back to workouts</button>
    </div>
  </div>
</div>
<script>
const WORKOUTS={"Week 1":[{name:"Workout 1",rounds:5,exercises:[{qty:"40",name:"Walking lunges"},{qty:"60sec",name:"Wall sit"},{qty:"20",name:"Push-up side plank"},{qty:"20",name:"Sit-ups"},{qty:"30",name:"Bicycle crunches"},{qty:"20",name:"Leg raises"}]},{name:"Workout 2",rounds:4,exercises:[{qty:"40",name:"Mountain climbers"},{qty:"45sec",name:"Low plank"},{qty:"40",name:"Sit-ups"},{qty:"20",name:"High plank knee-to-elbow"},{qty:"20",name:"Knee tuck crunch jumps"}]},{name:"Workout 3",rounds:5,exercises:[{qty:"40/30/20",name:"Jumping jacks"},{qty:"25/20/15",name:"Lunge to high knee L"},{qty:"25/20/15",name:"Lunge to high knee R"},{qty:"40/30/20",name:"Push-ups"},{qty:"60sec",name:"Low plank"}]},{name:"Workout 4",rounds:4,exercises:[{qty:"50",name:"Clap jacks"},{qty:"40",name:"Mountain climbers"},{qty:"30",name:"Rockstars"},{qty:"20",name:"Speed skaters"},{qty:"10",name:"Inchworm tuck jumps"}]},{name:"Workout 5",rounds:5,exercises:[{qty:"30",name:"Push-ups"},{qty:"30",name:"Jump squats"},{qty:"20",name:"Up downs"},{qty:"20",name:"Tricep dips"},{qty:"50",name:"Scissor kicks"}]}],"Week 2":[{name:"Workout 1",rounds:4,exercises:[{qty:"100",name:"Jumping jacks"},{qty:"25",name:"Burpees"},{qty:"15",name:"Pike push-ups"},{qty:"30",name:"Jump squats"},{qty:"90sec",name:"Low plank"},{qty:"90sec",name:"High plank"}]},{name:"Workout 2",rounds:3,exercises:[{qty:"120sec",name:"Low plank"},{qty:"120sec",name:"High plank"},{qty:"120sec",name:"Low plank"},{qty:"40",name:"High plank jacks"}]},{name:"Workout 3",rounds:5,exercises:[{qty:"50/20",name:"Touchdown lunges"},{qty:"50/20",name:"Star jacks"},{qty:"30/10",name:"Inchworms"},{qty:"10",name:"Burpees"},{qty:"AMRAP",name:"Push-ups"}]},{name:"Workout 4",rounds:5,exercises:[{qty:"50",name:"Burpees"},{qty:"50",name:"High knees"},{qty:"50",name:"Punches"},{qty:"50",name:"Scissor kicks"}]},{name:"Workout 5",rounds:5,exercises:[{qty:"30",name:"Push-ups"},{qty:"30",name:"Jump squats"},{qty:"20",name:"Up downs"},{qty:"20",name:"Tricep dips ump squats"},{qty:"30/10",name:"High knees"},{qty:"30/10",name:"Punches"},{qty:"10",name:"High plank limb raises"}]},{name:"Workout 4",rounds:6,exercises:[{qty:"40",name:"High knees"},{qty:"40",name:"Rockstars"},{qty:"20",name:"Burpees"}]},{name:"Workout 5",rounds:5,exercises:[{qty:"20",name:"Push-ups"},{qty:"15",name:"Side lunges L"},{qty:"15",name:"Side lunges R"},{qty:"20",name:"High plank knee crosses"},{qty:"20",name:"Tricep dips"},{qty:"20",name:"Jump squats"}]}],"Week 8":[{name:"Workout 1",rounds:4,exercises:[{qty:"20",name:"Burpees"},{qty:"15",name:"Curtsey lunge L"},{qty:"15",name:"Curtsey lunge R"},{qty:"60sec",name:"Low plank"},{qty:"30",name:"Squats"},{qty:"20",name:"Push-ups"},{qty:"80",name:"Scissor kicks"}]},{name:"Workout 2",rounds:5,exercises:[{qty:"60sec",name:"Low plank"},{qty:"60sec",name:"Reverse plank"},{qty:"100",name:"Bicycle crunches"},{qty:"20",name:"Skier abs"}]},{name:"Workout 3",rounds:1,exercises:[{qty:"100",name:"Burpees"},{qty:"100",name:"Punches"},{qty:"100",name:"Squats"},{qty:"100",name:"Lateral jumps"}]},{name:"Workout 4",rounds:5,exercises:[{qty:"15",name:"Lunge & twist L"},{qty:"15",name:"Lunge & twist R"},{qty:"30",name:"Speed skaters"},{qty:"30",name:"Push-ups"},{qty:"60sec",name:"Jumping jacks"},{qty:"20",name:"Inchworms"}]}],"Week 9":[{name:"Workout 1",rounds:4,exercises:[{qty:"60sec",name:"Low plank"},{qty:"20",name:"High plank knee to elbow"},{qty:"30sec",name:"Low side plank L"},{qty:"30sec",name:"Low side plank R"},{qty:"50",name:"Mountain climbers"}]},{name:"Workout 2",rounds:4,exercises:[{qty:"50",name:"Jumping jacks"},{qty:"50",name:"Clap jacks"},{qty:"50",name:"Speed skaters"},{qty:"50",name:"Punches"},{qty:"50",name:"High knees"},{qty:"30sec",name:"High plank"}]},{name:"Workout 3",rounds:5,exercises:[{qty:"20",name:"High plank jumping jacks"},{qty:"15",name:"Tricep dips"},{qty:"40",name:"Walking lunges"},{qty:"15",name:"Side plank oblique crunch L"},{qty:"15",name:"Side plank oblique crunch R"},{qty:"30",name:"Strai let selectedWeek="Week 1",currentWorkout=null,currentRound=0,currentExerciseIdx=0,timerInterval=null,timerSeconds=0,startTime=null,restInterval=null,restSeconds=0,countdownInterval=null;
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active')}
function renderWeekTabs(){const tabs=document.getElementById('week-tabs');tabs.innerHTML='';Object.keys(WORKOUTS).forEach(w=>{const btn=document.createElement('button');btn.className='week-tab'+(w===selectedWeek?' active':'');btn.textContent=w.replace('Week ','W');btn.onclick=()=>{selectedWeek=w;renderWeekTabs();renderWorkoutCards()};tabs.appendChild(btn)})}
function renderWorkoutCards(){const cards=document.getElementById('workout-cards');cards.innerHTML='';(WORKOUTS[selectedWeek]||[]).forEach((wo,i)=>{const card=document.createElement('div');card.className='workout-card';card.innerHTML='<h3>'+wo.name+'</h3><div class="meta">'+wo.exercises.length+' exercises<br>'+wo.rounds+' round'+(wo.rounds!==1?'s':'')+'</div><span class="badge">'+selectedWeek+'</span>';card.onclick=()=>startWorkout(selectedWeek,i);cards.appendChild(card)})}
function startWorkout(week,idx){currentWorkout={week,idx,data:WORKOUTS[week][idx]};currentRound=0;currentExerciseIdx=0;startTime=Date.now();timerSeconds=0;if(timerInterval)clearInterval(timerInterval);timerInterval=setInte
